name: Update API Client

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-api-client:
    name: Update API Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate API client
        run: make generate/api-client
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- internal/neon/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          signoff: true
          commit-message: "Update auto-generated API client from OpenAPI spec"
          branch: automated/update-api-client
          title: "Update auto-generated API client from OpenAPI spec"
          body: |
            This PR was automatically created because the [Neon API spec](https://neon.com/api_spec/release/v2.json) has changed.

            Please review the generated changes in `internal/neon/`.
